<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ningalkum Aakam Koodeshwaran Soundboard</title>

    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --btn-bg: #1e1e1e;
            --btn-hover: #2d2d2d;
            --btn-active: #3a3a3a;
            --btn-border: #333333;
            --btn-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --kill-btn-bg: #3a1515;
            --kill-btn-hover: #4a1c1c;
            --kill-btn-border: #5a2525;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .controls-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        #soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 800px;
        }

        .base-btn {
            color: var(--text-color);
            border-radius: 8px;
            padding: 1.5rem 1rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: transform 0.1s ease, background-color 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            word-wrap: break-word;
        }

        .base-btn:active {
            transform: scale(0.95);
        }

        .sound-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
        }

        .sound-btn:hover {
            background-color: var(--btn-hover);
        }

        .sound-btn:active {
            background-color: var(--btn-active);
        }

        .kill-switch {
            background-color: var(--kill-btn-bg);
            border: 1px solid var(--kill-btn-border);
            width: 100%;
            padding: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kill-switch:hover {
            background-color: var(--kill-btn-hover);
        }

        @media (max-width: 480px) {
            #soundboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h3>Ningalkum Aakam Koodeshwaran Soundboard</h3>
        <img src="Sounds/logo.webp" alt="koodeshwaran" width="100" height="100">
    </header>

    <div class="controls-container">
        <button class="base-btn kill-switch" id="kill-switch-btn">Stop All Sounds</button>
    </div>

    <main id="soundboard-grid"></main>

    <script>
        /**
         * Configuration Array
         */
        const SOUNDS = [
            { label: "Ticking", file: "Sounds/Tick.mp3" },
            { label: "Incorrect Buzzer", file: "Sounds/Wrong.mp3" },
            { label: "Correct Buzzer", file: "Sounds/Correct.mp3" },
            { label: "Suresh Gopi Intro music", file: "Sounds/Intro.mp3" },
            { label: "Contestant 1 Intro music", file: "Sounds/Dora.mp3" },
            { label: "Contestant 2 Intro music", file: "Sounds/Dus.mp3" },
            { label: "Contestant 3 Intro music", file: "Sounds/OUAT.mp3" }
        ];


        const grid = document.getElementById('soundboard-grid');
        const killSwitchBtn = document.getElementById('kill-switch-btn');
        const audioInstances = {};

        // Pre-load audio objects
        SOUNDS.forEach(sound => {
            const audio = new Audio(`sounds/${sound.file}`);
            audio.preload = 'auto';
            audioInstances[sound.label] = audio;
        });

        function playSound(label) {
            const audio = audioInstances[label];
            if (!audio) return;

            audio.currentTime = 0;
            
            audio.play().catch(error => {
                console.warn('Playback prevented by browser policy:', error);
            });
        }

        function stopAllSounds() {
            Object.values(audioInstances).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
        }

        function initializeBoard() {
            // Setup Kill Switch
            killSwitchBtn.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                stopAllSounds();
            });
            killSwitchBtn.addEventListener('contextmenu', e => e.preventDefault());

            // Setup Sound Buttons
            SOUNDS.forEach(sound => {
                const btn = document.createElement('button');
                btn.className = 'base-btn sound-btn';
                btn.textContent = sound.label;
                
                btn.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    playSound(sound.label);
                });

                btn.addEventListener('contextmenu', e => e.preventDefault());

                grid.appendChild(btn);
            });
        }

        document.addEventListener('DOMContentLoaded', initializeBoard);
    </script>
</body>
</html>
